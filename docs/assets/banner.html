<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NJ-Kit banner source (1280x640)</title>
<!-- Static design of the banner (1280x640). docs/assets/banner.png is now frame 4.6 s of the animated source docs/assets/src/banner.html, which also renders banner.gif. -->
<style>
@font-face{font-family:"NJK Display";src:url("../../site/fonts/display-bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"NJK Sans";src:url("../../site/fonts/sans-regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"NJK Sans";src:url("../../site/fonts/sans-bold.woff2") format("woff2");font-weight:700}
:root{--bg:#0e1311;--surface:#161d1a;--line:rgba(214,232,222,.10);--line2:rgba(214,232,222,.20);--text:#e6ece8;--mute:#9aa7a0;--acc:#c2ea4e;--on:#0e1311}
html,body{margin:0;background:var(--bg)}
.b{width:1280px;height:640px;position:relative;overflow:hidden;background:radial-gradient(60% 80% at 82% 50%,rgba(194,234,78,.10),transparent 70%),var(--bg);color:var(--text);font-family:"NJK Sans",sans-serif;display:grid;grid-template-columns:1fr 470px;align-items:center;padding:0 72px 0 88px;box-sizing:border-box}
.b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--acc)}
.brand{display:flex;align-items:center;gap:22px}
.mark{width:84px;height:84px;border-radius:8px;background:var(--acc);display:grid;place-items:center}
.mark svg{width:56px;height:56px;color:var(--on);stroke-width:3}
.name{font-weight:700;font-size:112px;line-height:1;letter-spacing:-.04em}
h1{margin:34px 0 0;font-weight:700;font-size:46px;line-height:1.15;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--acc)}
.ar{margin:14px 0 0;font-size:34px;color:var(--mute);direction:rtl;text-align:left;unicode-bidi:plaintext}
.chips{display:flex;gap:10px;margin-top:38px}
.chips span{border:1px solid var(--line2);border-radius:4px;padding:10px 14px;font-size:21px;font-weight:700;color:var(--text)}
.chips span.g{background:var(--acc);border-color:var(--acc);color:var(--on)}
svg.loop{width:470px;height:auto;overflow:visible}
.ring{fill:none;stroke:var(--line2);stroke-width:1.5}.ring2{fill:none;stroke:var(--line);stroke-dasharray:3 7}
.disc{fill:var(--surface);stroke:var(--line2);stroke-width:1.5}
.node use{color:var(--text);stroke-width:1.75}
.gate .disc{fill:var(--acc);stroke:var(--acc)}.gate use{color:var(--on)}
.lbl{font:700 19px "NJK Sans";fill:var(--mute);text-anchor:middle}
.pass{font:700 70px "NJK Display";fill:var(--acc);text-anchor:middle;letter-spacing:.04em}
.halo{fill:var(--acc);opacity:.22}
</style>
</head>
