<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=640" />
<title>NJ-Kit banner (animated)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"NJK Display";src:url("../../../site/fonts/display-bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"NJK Sans";src:url("../../../site/fonts/sans-regular.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"NJK Sans";src:url("../../../site/fonts/sans-bold.woff2") format("woff2");font-weight:700;font-display:block}
:root{--bg:#0e1311;--surface:#161d1a;--raise:#1c2420;--line:rgba(214,232,222,.10);--line2:rgba(214,232,222,.20);--text:#e6ece8;--mute:#9aa7a0;--acc:#c2ea4e;--on:#0e1311}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1280px;height:640px;overflow:hidden;background:var(--bg);color:var(--text);font-family:"NJK Sans",sans-serif}
#light{position:absolute;left:520px;top:-160px;width:960px;height:960px;border-radius:50%;background:radial-gradient(closest-side,rgba(194,234,78,.13),rgba(194,234,78,.04) 55%,transparent)}
#grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.35;-webkit-mask-image:radial-gradient(70% 90% at 78% 50%,#000,transparent 75%);mask-image:radial-gradient(70% 90% at 78% 50%,#000,transparent 75%)}
#bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--acc)}
#copy{position:absolute;left:88px;top:0;height:640px;width:680px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:22px}
.mark{width:84px;height:84px;border-radius:8px;background:var(--acc);display:grid;place-items:center;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.mark svg{width:56px;height:56px;color:var(--on);stroke-width:3}
.namewrap{position:relative}
.name{display:block;font-weight:700;font-size:112px;line-height:1;letter-spacing:-.04em}
#shine{position:absolute;left:0;top:0;font-weight:700;font-size:112px;line-height:1;letter-spacing:-.04em;color:transparent;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);background-size:300% 100%;background-position:0% 0;-webkit-background-clip:text;background-clip:text}
h1{margin:34px 0 0;font-weight:700;font-size:46px;line-height:1.15;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--acc)}
.ar{margin:14px 0 0;font-size:34px;color:var(--mute);direction:rtl;text-align:left;unicode-bidi:plaintext}
.chips{display:flex;gap:10px;margin-top:38px}
.chips span{border:1px solid var(--line2);border-radius:4px;padding:10px 14px;font-size:21px;font-weight:700;color:var(--text);background:rgba(22,29,26,.6)}
.chips span.g{background:var(--acc);border-color:var(--acc);color:var(--on)}
#orbit{position:absolute;left:752px;top:52px;width:470px;height:479px;overflow:visible}
.ring{fill:none;stroke:var(--line2);stroke-width:1.5}.ring2{fill:none;stroke:var(--line2);stroke-dasharray:3 7}
.disc{fill:var(--surface);stroke:var(--line2);stroke-width:1.5}
.node use{color:var(--text);stroke-width:1.75}
.gate .disc{fill:var(--acc);stroke:var(--acc)}.gate use{color:var(--on)}
.lbl{font:700 19px "NJK Sans";fill:var(--mute);text-anchor:middle}
.pass{font:700 70px "NJK Display";fill:var(--acc);text-anchor:middle;letter-spacing:.04em}
.sub{font:700 15px "NJK Sans";fill:var(--mute);text-anchor:middle;letter-spacing:.22em}
.halo{fill:var(--acc);opacity:.22}
.tail{fill:none;stroke:var(--acc);stroke-linecap:round}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<!--ICONS: Lucide icons, ISC licence (lucide.dev)-->
<symbol id="i-scan-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><circle cx="12" cy="12" r="1" /><path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0" /></symbol>
<symbol id="i-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16" /><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" /></symbol>
<symbol id="i-list-checks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" /><path d="M13 12h8" /><path d="M13 19h8" /><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8" /><path d="m4 17 6-6-6-6" /></symbol>
<symbol id="i-circle-check-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></symbol>
<symbol id="i-refresh-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
<!--/ICONS-->
<defs>
  <filter id="lift" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter>
  <radialGradient id="tokglow"><stop offset="0" stop-color="#c2ea4e" stop-opacity=".55"/><stop offset="1" stop-color="#c2ea4e" stop-opacity="0"/></radialGradient>
</defs>
</svg>
<div id="stage" data-composition-id="njkit-banner" data-start="0" data-duration="6" data-fps="25" data-width="1280" data-height="640">
  <div id="light"></div>
  <div id="grid"></div>
  <div id="copy">
    <div class="brand"><span class="mark"><svg aria-hidden="true" fill="none"><use href="#i-check"/></svg></span><span class="namewrap"><span class="name" data-layout-allow-occlusion>NJ-Kit</span><span id="shine" aria-hidden="true" data-layout-allow-occlusion>NJ-Kit</span></span></div>
    <h1>A working method for <em>Claude&nbsp;Code.</em></h1>
    <p class="ar">منهج عمل واحد لـ Claude Code</p>
    <div class="chips"><span>40 skills</span><span class="g" id="chipPass">PASS / FAIL gates</span><span>EN + AR</span><span>MIT</span></div>
  </div>
  <svg id="orbit" viewBox="0 0 520 530" aria-hidden="true">
    <g id="rings"><circle class="ring" cx="260" cy="260" r="180"/><circle id="ring2" class="ring2" cx="260" cy="260" r="112"/></g>
    <g id="sweep">
      <circle cx="397.9" cy="375.7" r="26" fill="url(#tokglow)"/>
      <circle class="tail" cx="260" cy="260" r="180" stroke-width="3" opacity=".18" stroke-dasharray="126 1200" stroke-dashoffset="0"/>
      <circle class="tail" cx="260" cy="260" r="180" stroke-width="3" opacity=".35" stroke-dasharray="70 1200" stroke-dashoffset="-56"/>
      <circle class="tail" cx="260" cy="260" r="180" stroke-width="3" opacity=".7" stroke-dasharray="28 1200" stroke-dashoffset="-98"/>
      <circle cx="397.9" cy="375.7" r="8" fill="#c2ea4e"/>
    </g>
    <circle id="halo" class="halo" cx="104.1" cy="350" r="44"/>
    <circle id="burst" cx="104.1" cy="350" r="32" fill="none" stroke="#c2ea4e" stroke-width="3" opacity="0"/>
    <g class="node" id="n0" filter="url(#lift)"><circle class="disc" cx="260" cy="80" r="32"/><use href="#i-scan-eye" x="246" y="66" width="28" height="28"/></g>
    <g class="node" id="n1" filter="url(#lift)"><circle class="disc" cx="415.9" cy="170" r="32"/><use href="#i-book-open" x="401.9" y="156" width="28" height="28"/></g>
    <g class="node" id="n2" filter="url(#lift)"><circle class="disc" cx="415.9" cy="350" r="32"/><use href="#i-list-checks" x="401.9" y="336" width="28" height="28"/></g>
    <g class="node" id="n3" filter="url(#lift)"><circle class="disc" cx="260" cy="440" r="32"/><use href="#i-terminal" x="246" y="426" width="28" height="28"/></g>
    <g class="node gate" id="n4" filter="url(#lift)"><circle class="disc" cx="104.1" cy="350" r="32"/><use href="#i-circle-check-big" x="90.1" y="336" width="28" height="28"/></g>
    <g class="node" id="n5" filter="url(#lift)"><circle class="disc" cx="104.1" cy="170" r="32"/><use href="#i-refresh-cw" x="90.1" y="156" width="28" height="28"/></g>
    <text class="lbl" id="l0" x="260" y="30">analyse</text><text class="lbl" id="l1" x="466" y="128">find the skill</text><text class="lbl" id="l2" x="466" y="404">plan</text>
    <text class="lbl" id="l3" x="260" y="502">execute</text><text class="lbl" id="l4" x="54" y="404">gate</text><text class="lbl" id="l5" x="54" y="128">review</text>
    <text class="sub" x="260" y="226">THE GATE SAYS</text>
    <text class="pass" id="pass" x="260" y="290">PASS</text>
  </svg>
  <div id="bar"></div>
</div>
<script>
  const ID = "njkit-banner", D = 6;
  const tl = gsap.timeline({ paused: true });
  // the token: one constant-speed lap, 360 degrees in D seconds, so frame D equals frame 0
  tl.fromTo("#sweep", { rotation: -160, svgOrigin: "260 260" }, { rotation: 200, svgOrigin: "260 260", duration: D, ease: "none" }, 0);
  tl.fromTo("#ring2", { rotation: 0, svgOrigin: "260 260" }, { rotation: -36, svgOrigin: "260 260", duration: D, ease: "none" }, 0);
  // light and depth stay still (whole-frame drift tripled the GIF); depth comes from shadows, glow and the burst
  // each node lights as the token passes it (arrivals at 0.5 s + i)
  for (let i = 0; i < 6; i++) {
    const t = 0.5 + i, n = "#n" + i, l = "#l" + i, gate = i === 4;
    tl.to(n, { scale: 1.17, transformOrigin: "50% 50%", duration: 0.16, ease: "back.out(3)" }, t - 0.1);
    tl.to(n, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.16);
    if (!gate) {
      tl.to(n + " .disc", { stroke: "#c2ea4e", fill: "#1c2420", duration: 0.12 }, t - 0.1);
      tl.to(n + " use", { color: "#c2ea4e", duration: 0.12 }, t - 0.1);
      tl.to(n + " .disc", { stroke: "rgba(214,232,222,.20)", fill: "#161d1a", duration: 0.3 }, t + 0.16);
      tl.to(n + " use", { color: "#e6ece8", duration: 0.3 }, t + 0.16);
    }
    tl.to(l, { fill: "#e6ece8", duration: 0.12 }, t - 0.1);
    tl.to(l, { fill: "#9aa7a0", duration: 0.3 }, t + 0.16);
  }
  // the gate beat at 4.5 s: burst, PASS lights, the chip and the name catch the light
  tl.fromTo("#burst", { attr: { r: 32 }, opacity: 0.8 }, { attr: { r: 92 }, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 4.42);
  tl.to("#halo", { attr: { r: 56 }, opacity: 0.4, duration: 0.18, ease: "power2.out" }, 4.4);
  tl.to("#halo", { attr: { r: 44 }, opacity: 0.22, duration: 0.6, ease: "power2.inOut" }, 4.6);
  tl.fromTo("#pass", { opacity: 0.3, scale: 1, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.06, duration: 0.2, ease: "back.out(2.5)" }, 4.42);
  tl.to("#pass", { scale: 1, duration: 0.25, ease: "power2.out" }, 4.62);
  tl.to("#pass", { opacity: 0.3, duration: 0.9, ease: "power1.inOut" }, 5.0);
  tl.to("#chipPass", { boxShadow: "0 0 26px rgba(194,234,78,.55)", duration: 0.2 }, 4.45);
  tl.to("#chipPass", { boxShadow: "0 0 0px rgba(194,234,78,0)", duration: 0.7 }, 4.75);
  tl.fromTo("#shine", { backgroundPosition: "0% 0" }, { backgroundPosition: "100% 0", duration: 0.8, ease: "power1.inOut", immediateRender: false }, 4.6);
  tl.set("#shine", { backgroundPosition: "0% 0" }, 5.9);
  gsap.set("#pass", { opacity: 0.3 });
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
</script>
</body>
</html>
