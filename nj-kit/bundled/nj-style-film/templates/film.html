      @font-face { font-family: "Thmanyah Sans"; font-weight: 700; src: url("assets/thmanyahsans-Bold.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #050506; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Thmanyah Sans", sans-serif; }

      /* ONE film, two frames. Every scene is a words box and a 960x900 prop box;
         the aspect only says where the two boxes sit and how big the type is. */
      body.v { --wl: 60px; --wt: 235px; --ww: 960px; --wh: 350px; --pl: 60px; --pt: 610px;
               --sl: 60px; --st: 520px; --sw: 960px; --sh: 800px; --fs: 84px; --hero: 120px; --punch: 108px; --end: 1; }
      body.h { --wl: 90px; --wt: 140px; --ww: 780px; --wh: 800px; --pl: 900px; --pt: 90px;
               --sl: 360px; --st: 140px; --sw: 1200px; --sh: 800px; --fs: 72px; --hero: 104px; --punch: 92px; --end: 0.84; }

      .scene { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; }
      .cream { background: #FBF6EE; color: #15171A; }
      .black { background: #050506; color: #FFFFFF; }
      .abs { position: absolute; }
      .rib { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .rib path { fill: none; stroke: #B9B5AE; stroke-width: 120px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
      .words { position: absolute; left: var(--wl); top: var(--wt); width: var(--ww); height: var(--wh); }
      .words.solo { left: var(--sl); top: var(--st); width: var(--sw); height: var(--sh); }
      .prop { position: absolute; left: var(--pl); top: var(--pt); width: 960px; height: 900px; }

      .phrase { position: absolute; left: 0; top: 50%; width: 100%; transform: translateY(-50%); display: flex; flex-wrap: wrap;
        justify-content: center; align-items: baseline; column-gap: 22px; row-gap: 4px; line-height: 1.05;
        letter-spacing: -0.03em; font-weight: 500; font-size: var(--fs); }
      .w { display: inline-block; white-space: nowrap; }
      .w.hero { font-weight: 700; font-size: var(--hero); color: #E5533A; }
      .w.punch { font-weight: 700; font-size: var(--punch); }
      .phrase.small .w.hero { font-size: calc(var(--hero) * 0.82); }
      .black .w { text-shadow: 0 0 30px rgba(255, 255, 255, 0.4); }
      .black .w.hero { text-shadow: 0 0 38px rgba(229, 83, 58, 0.75); }
      /* Light-ground fix (prefilm-fix-0921, choreography.md #2): a cut-out hero on a
         ground whose luminance is above 0.8 sits on a dark-paper backing shape,
         marked data-hero-backing, larger than the hero, so a paper-white sticker
         stroke has something to separate against. Navy/teal per Lead's decision;
         size/position set per scene. On dark or saturated grounds, do not add this. */
      .hero-backing { position: absolute; background: #0B1F2A; border-radius: 28px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); }

      .card { position: absolute; left: 0; top: 0; width: 960px; height: 900px; border-radius: 28px; overflow: hidden; background: #0f1216; }
      .card.pop { left: 213px; width: 534px; }
      .black .card { box-shadow: 0 0 140px rgba(255, 255, 255, 0.13), 0 0 0 2px rgba(255, 255, 255, 0.08); }
      .cream .card { box-shadow: 0 30px 60px rgba(21, 23, 26, 0.3); border-radius: 20px; }
      .card img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
      .pin { position: absolute; left: 456px; top: -24px; width: 48px; height: 48px; border-radius: 50%; background: #D8402B;
        box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.18), 0 10px 14px rgba(21, 23, 26, 0.35); }
      .ring { position: absolute; border: 6px solid #E5533A; border-radius: 16px; box-shadow: 0 0 44px rgba(229, 83, 58, 0.65); }
      .cur { position: absolute; left: 0; top: 0; width: 72px; height: 88px; }
      .wipe { position: absolute; left: 50%; top: 50%; width: 4600px; height: 4600px; margin: -2300px 0 0 -2300px; border-radius: 50%; }
      .endcol { position: absolute; left: 50%; top: 50%; width: 960px; height: 1120px; margin: -560px 0 0 -480px; transform: scale(var(--end)); }
      .endcol .phrase { top: auto; transform: none; }
      .end { position: absolute; left: 0; width: 960px; text-align: center; letter-spacing: -0.01em; }
    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const sfx = () => {}; /* a sound cue: mix.py reads these calls out of this file */
      const W = /*WORDS*/[];

      /* A phrase is n spoken words in one box; it clears when the next phrase starts, unless keep. */
      function say(line, host, phrases) {
        const words = W.filter((w) => w[0] === line);
        let i = 0;
        phrases.forEach((p) => {
          const box = document.createElement("div");
          box.className = "phrase" + (p.small ? " small" : "");
          if (p.y != null) box.style.top = p.y + "px";
          host.appendChild(box);
          words.slice(i, i + p.n).forEach((w, j) => {
            const s = document.createElement("span");
            const hero = (p.hero || []).includes(j), punch = (p.punch || []).includes(j);
            s.className = "w" + (hero ? " hero" : "") + (punch ? " punch" : "");
            if (p.size) s.style.fontSize = p.size + "px";
            s.textContent = w[1];
            s.setAttribute("data-layout-allow-overlap", "");
            box.appendChild(s);
            tl.fromTo(s, { opacity: 0, scale: 0.86, y: 18, filter: "blur(12px)" },
              { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: hero || punch ? "back.out(2.2)" : "power3.out" }, w[2]);
          });
          i += p.n;
          if (!p.keep && words[i]) tl.to(box, { opacity: 0, duration: 0.15 }, words[i][2] - 0.2);
        });
      }
      const pop = (el, t, from) => tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.9, y: 60 }, from || {}), { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const wipe = (el, t) => tl.fromTo(el, { scale: 0 }, { scale: 1, duration: 0.34, ease: "power2.inOut" }, t);
      const show = (el, t) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.16 }, t);
      const drift = (el, t, d) => tl.to(el, { y: -18, duration: d, ease: "none" }, t);
      function ring(host, x, y, w, h, t, until) {
        const r = document.createElement("div");
        r.className = "ring";
        r.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px";
        r.setAttribute("data-layout-allow-overlap", "");
        host.appendChild(r);
        tl.fromTo(r, { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, t);
        if (until) tl.to(r, { opacity: 0, duration: 0.15 }, until);
      }
      const click = (cur, x, y, t) => {
        tl.to(cur, { x: x, y: y, duration: 0.5, ease: "power2.inOut" }, t - 0.55);
        tl.to(cur, { scale: 0.8, duration: 0.08, yoyo: true, repeat: 1 }, t);
      };

      gsap.set($("s1rib"), { strokeDasharray: 5000, strokeDashoffset: 5000 });
      tl.to($("s1rib"), { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.05); sfx(0.05, "swish", -4);
      tl.fromTo($("s1mark"), { opacity: 0, scale: 0.4, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 0.7); sfx(0.76, "reveal", -3);
      sfx(2.43, "tick");
      wipe($("s1wipe"), 3.17); sfx(3.15, "swish");

      /* 2 */

      click($("s2cur"), 448, 508, 8.02); show($("s2c"), 8.1); sfx(8.02, "tick", 3); sfx(8.1, "success", -4);
      drift($("s2card"), 4.0, 4.6);

      pop($("s3card2"), 10.3, { y: 0, scale: 0.94 }); sfx(10.3, "reveal", -4);

      tl.fromTo($("s5wall"), { y: -760 }, { y: -5600, duration: 2.75, ease: "power1.inOut" }, 20.35); sfx(20.4, "swish", -6); sfx(21.6, "swish", -8);
      wipe($("s5wipe"), 22.99); sfx(22.97, "swish");

      /* 6 */
      say(6, $("s6w"), [{ n: 2, hero: [1], small: true }, { n: 3, hero: [1, 2] }, { n: 3, hero: [2], keep: true }]);
      gsap.set($("s6wall"), { y: -2360 });
      pop($("s6card"), 23.34);
